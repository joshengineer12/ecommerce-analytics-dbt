version: 2

seeds:
  - name: raw_order_items
    description: >
      Order line item data representing individual products within orders.
      Contains quantity and pricing at time of purchase.
    config:
      tags: ['raw', 'transactions']
    columns:
      - name: order_item_id
        description: Unique identifier for each line item
        data_tests:
          - unique
          - not_null

      - name: order_id
        description: Foreign key to the parent order
        data_tests:
          - not_null

      - name: product_id
        description: Foreign key to the product
        data_tests:
          - not_null

      - name: quantity
        description: Number of units ordered
        data_tests:
          - not_null

      - name: price
        description: Unit price at time of purchase (may differ from current price)
        data_tests:
          - not_null
