version: 2

models:
  - name: fct_customer_cohorts
    description: >
      Customer cohort analysis for retention and lifetime value tracking.
      Enables cohort-based retention curves and revenue attribution by
      acquisition period.

      **Grain**: One row per cohort per period (months since signup)
      **Materialization**: Table
      **Update Frequency**: Daily

      ## Business Context
      Essential for understanding customer lifecycle and measuring retention.
      Supports CAC payback analysis and cohort-based LTV calculations.

      ## Key Metrics
      - Retention rate by cohort and period
      - Revenue per cohort
      - Cumulative LTV per customer

      ## Visualization
      Ideal for cohort retention heatmaps and LTV curves.

    config:
      tags: ['marts', 'marketing', 'fact', 'cohort']

    columns:
      - name: cohort_month
        description: >
          Month when customers in this cohort signed up.
          Composite key with months_since_signup.
        data_tests:
          - not_null

      - name: months_since_signup
        description: >
          Periods elapsed since signup (0 = signup month).
          Composite key with cohort_month.
        data_tests:
          - not_null

      - name: cohort_size
        description: Total customers who signed up in cohort_month

      - name: active_customers
        description: Customers from cohort who ordered in this period

      - name: order_count
        description: Total orders from cohort in this period

      - name: retention_rate_pct
        description: >
          Percentage of cohort still active.
          Calculated as: (active_customers / cohort_size) * 100

      - name: gross_revenue
        description: Revenue from cohort in this period (USD)

      - name: net_revenue
        description: Net revenue from cohort in this period (USD)

      - name: avg_order_value
        description: Average order value for cohort in this period (USD)

      - name: revenue_per_cohort_customer
        description: >
          Period revenue divided by total cohort size.
          Normalizes for cohort size comparison.

      - name: cumulative_revenue
        description: >
          Running total of net revenue for this cohort.
          Sum of all revenue from month 0 through current period.

      - name: cumulative_revenue_per_customer
        description: >
          Cumulative revenue divided by cohort size.
          This is the LTV metric for cohort analysis.

      - name: _updated_at
        description: Timestamp of last model refresh

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - cohort_month
            - months_since_signup
